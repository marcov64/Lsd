<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT group (name, description)>
 		<!ELEMENT name (#PCDATA)>
 		<!ELEMENT description (#CDATA)>
]>
<LSD>
	<group>
		<name>Literature Models</name>
		<description><![CDATA[Literature Models

Lsd implementations of few models widely known in the literature.

The group of Literature models include:
- Nelson and Winter, 1982
- NK Fitness Landscape, Kauffman
- B.Arthur network externality model
- Artificial Life; CA imitating their neighbours
- Coordination game
- Lotka-Volterra (discrete prey-predator model)]]></description>
	</group>
</LSD>
