<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT group (name, description)>
 		<!ELEMENT name (#PCDATA)>
 		<!ELEMENT description (#PCDATA)>
]>
<LSD>
	<group>
		<name>Literature Models</name>
		<description><![CDATA[Literature Models

LSD implementations of a few models widely known in the literature.

The group of Literature models include:
- B. Arthur network externality model
- Comway game of life
- Nelson and Winter evolutionary competition model
- Broadbent and Hammersley percolation model
- Richardson competition model
- Schelling neighbour segregation model
- Smallwood and Conlisk social diffusion model]]></description>
	</group>
</LSD>
