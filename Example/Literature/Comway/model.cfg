<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>Game of Life</model_name>
			<model_version>0.1</model_version>
			<model_date>06 July, 2017</model_date>
			<model_path></model_path>
		</settings>
		<geometry>
			<lsd_geom></lsd_geom>
			<log_geom></log_geom>
			<str_geom></str_geom>
			<da_geom></da_geom>
			<deb_geom></deb_geom>
			<lat_geom></lat_geom>
			<plt_geom></plt_geom>
			<dap_geom></dap_geom>
		</geometry>
		<makefile><![CDATA[# LSD options
TARGET=LSD
FUN=fun_Comway
PRECOMPILED=true

# Additional model files
FUN_EXTRA=

# Compiler options
SWITCH_CC= -O3
SWITCH_CC_LNK=]]></makefile>
		<configuration last_obj="Root" last_list="1" last_item="0" last_first="0.0" str_wnd="1">
			<last_conf>Sim1.lsd</last_conf>
		</configuration>
	</model>
</LSD>
