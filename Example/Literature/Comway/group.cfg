<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT group (name, description)>
 		<!ELEMENT name (#PCDATA)>
 		<!ELEMENT description (#PCDATA)>
]>
<LSD>
	<group>
		<name>Comway</name>
		<description><![CDATA[Set of models based on Comway's Game of Life Model

Three different implementations in LSD.

1. A very simple, non-optimized version
2. An optimized version, using a C function to speed up computation
3. A more general version of the game, supporting multiple strategies]]></description>
	</group>
</LSD>
