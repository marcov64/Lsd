<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>Multi-country (simple)</model_name>
			<model_version>1.0</model_version>
			<model_date>01 January, 2019</model_date>
			<model_path></model_path>
		</settings>
		<geometry>
			<lsd_geom></lsd_geom>
			<log_geom></log_geom>
			<str_geom></str_geom>
			<da_geom></da_geom>
			<deb_geom></deb_geom>
			<lat_geom></lat_geom>
			<plt_geom></plt_geom>
			<dap_geom></dap_geom>
		</geometry>
		<makefile><![CDATA[TARGET=LSD
FUN=fun_multicountryJEDC_simple
FUN_EXTRA=
SWITCH_CC=-O3
SWITCH_CC_LNK=]]></makefile>
		<configuration>
			<last_conf>Sim_2c.lsd</last_conf>
		</configuration>
	</model>
</LSD>
