<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>K+S (energy)</model_name>
			<model_version>0.5.2</model_version>
			<model_date>01 September, 2023</model_date>
			<model_path></model_path>
		</settings>
		<geometry>
			<lsd_geom></lsd_geom>
			<log_geom></log_geom>
			<str_geom></str_geom>
			<da_geom></da_geom>
			<deb_geom></deb_geom>
			<lat_geom></lat_geom>
			<plt_geom></plt_geom>
			<dap_geom></dap_geom>
		</geometry>
		<configuration>
			<last_conf>Baseline.lsd</last_conf>
		</configuration>
		<makefile><![CDATA[TARGET=LSD
FUN=fun_KS
FUN_EXTRA=fun_KS_class.h fun_KS_country.h fun_KS_financial.h fun_KS_bank.h fun_KS_climate.h fun_KS_energy.h fun_KS_firme.h fun_KS_dirty.h fun_KS_green.h fun_KS_labor.h fun_KS_capital.h fun_KS_firm1.h fun_KS_consumption.h fun_KS_firm2.h fun_KS_vintage.h fun_KS_stats.h fun_KS_test.h fun_KS_support.h
SWITCH_CC=-O3
SWITCH_CC_LNK=]]></makefile>
	</model>
</LSD>
