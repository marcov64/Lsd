<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>DSK (refresh)</model_name>
			<model_version>0.4.1</model_version>
			<model_date>01 January, 2022</model_date>
		</settings>
		<geometry>
		</geometry>
		<configuration>
			<last_conf>Baseline.lsd</last_conf>
		</configuration>
		<makefile><![CDATA[# LSD options
TARGET=LSD
EQUATION=fun_KS
PRECOMPILED=true

# Additional model files
EXTRA=fun_KS_class.h fun_KS_country.h fun_KS_financial.h fun_KS_bank.h fun_KS_climate.h fun_KS_energy.h fun_KS_dirty.h fun_KS_green.h fun_KS_labor.h fun_KS_capital.h fun_KS_firm1.h fun_KS_consumption.h fun_KS_firm2.h fun_KS_vintage.h fun_KS_stats.h fun_KS_test.h fun_KS_support.h

# Compiler options
SWITCH_CC=-Wall -Wno-unused-variable -Wno-unused-but-set-variable -Wno-maybe-uninitialized -O3
SWITCH_CC_LNK=]]></makefile>
	</model>
</LSD>
