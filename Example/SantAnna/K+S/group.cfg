<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT group (name, description)>
 		<!ELEMENT name (#PCDATA)>
 		<!ELEMENT description (#PCDATA)>
]>
<LSD>
	<group>
		<name>K+S Series</name>
		<description><![CDATA[Shumpeter Meeting Keynes (K+S) series of models

From the seminal JEDC 2010 K+S (original) model, the series keeps evolving by adding new features to the base model:

K+S (finance) including a competitive financial sector and central bank
K+S (var.firms) adding endogenous entry of firms, independent from exits
DSK (refresh) an update of the K+S-based DSK climate assessment model
K+S (energy) introduce a competitive energy sector with climate effects
K+S (labor) turn workers into heterogeneous learning agents
K+S (trade) allows trade between countries and floating exchange rates
K+S (multi-industry) adds endogenous entry and exit of industries
]]></description>
	</group>
</LSD>
