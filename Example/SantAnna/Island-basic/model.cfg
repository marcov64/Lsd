<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>Island (basic)</model_name>
			<model_version>1.0</model_version>
			<model_date>30 January, 2024</model_date>
			<model_path></model_path>
		</settings>
		<geometry>
			<lsd_geom></lsd_geom>
			<log_geom></log_geom>
			<str_geom></str_geom>
			<da_geom></da_geom>
			<deb_geom></deb_geom>
			<lat_geom></lat_geom>
			<plt_geom></plt_geom>
			<dap_geom></dap_geom>
		</geometry>
		<configuration>
			<last_conf>l0=10_l0radius=25_T=500.lsd</last_conf>
		</configuration>
		<makefile><![CDATA[TARGET=LSD
FUN=fun_Island
FUN_EXTRA=
SWITCH_CC=-O3
SWITCH_CC_LNK=]]></makefile>
	</model>
</LSD>
