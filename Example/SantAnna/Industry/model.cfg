<?xml version="1.0" encoding="ISO-8859-1" standalone="yes"?>
<!DOCTYPE LSD [
 		<!ELEMENT LSD (model)>
 		<!ELEMENT model (settings, geometry, configuration?, makefile)>
 		<!ELEMENT settings (#PCDATA)>
 		<!ELEMENT geometry (#PCDATA)>
 		<!ELEMENT configuration (#PCDATA)>
 		<!ELEMENT makefile (#PCDATA)>
]>
<LSD>
	<model version="1.0" description="LSD model configuration file">
		<settings>
			<model_name>Industry</model_name>
			<model_version>2.1</model_version>
			<model_date>12 July, 2024</model_date>
			<model_path></model_path>
		</settings>
		<geometry>
			<lsd_geom></lsd_geom>
			<log_geom></log_geom>
			<str_geom></str_geom>
			<da_geom></da_geom>
			<deb_geom></deb_geom>
			<lat_geom></lat_geom>
			<plt_geom></plt_geom>
			<dap_geom></dap_geom>
		</geometry>
		<configuration>
			<last_conf>Baseline-Beta.lsd</last_conf>
		</configuration>
		<makefile><![CDATA[# LSD options
TARGET=LSD
FUN=fun_industry
PRECOMPILED=true
DEBUG_TERM=false
PYTHON_API=false

# Additional model files
FUN_EXTRA=

# Compiler options
SWITCH_CC= -O3
SWITCH_CC_LNK=]]></makefile>
	</model>
</LSD>
